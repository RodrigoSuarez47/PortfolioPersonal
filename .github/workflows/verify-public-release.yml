name: Public release verification
on:
  push:
    branches: [verify/public-career-release]
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public HTML, data and PDF bytes without authentication
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          const base = "https://rodrigosuarez.vercel.app";
          async function get(path, accept) {
            const response = await fetch(base + path, {headers:{Accept:accept}, redirect:"error", signal:AbortSignal.timeout(30000)});
            assert.equal(response.status,200,path);
            return response;
          }
          for (const path of ["/","/en"]) {
            const html=await (await get(path,"text/html")).text();
            assert.ok(html.includes("10/2026"));
            assert.ok(html.includes("12/2020"));
            assert.ok(html.includes("body=Hello") || html.includes("body=Hola"));
            assert.ok(html.includes("google.com/maps"));
            assert.ok(html.includes(".avif"));
            console.log(path+" public HTML, timeline, email body, map and AVIF: OK");
          }
          const data=await (await get("/portfolio.json","application/json")).json();
          for (const locale of ["es","en"]) {
            assert.equal(data[locale].experience.length,5);
            assert.equal(data[locale].experience[0].since,"10/2026");
            assert.ok(data[locale].experience[1].description.includes("Ratio"));
          }
          for (const [path,expected] of [
            ["/documents/Cv_Rodrigo_Suarez.pdf","7b7f0a50dbd45b93eb6b909329617a8edb197d49"],
            ["/documents/Cv_Rodrigo_Suarez_EN.pdf","bf27a8506fca1cd9c5af2016c3e36a9fc19307ab"]
          ]) {
            const response=await get(path,"application/pdf");
            const bytes=Buffer.from(await response.arrayBuffer());
            assert.equal(bytes.subarray(0,5).toString(),"%PDF-");
            const hash=createHash("sha1").update("blob "+bytes.length+"\0").update(bytes).digest("hex");
            assert.equal(hash,expected,path+": published PDF must match validated artifact");
            console.log(path+" public PDF matches validated one-page resume: OK");
          }
          NODE
