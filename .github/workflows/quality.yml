name: Portfolio quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm audit --audit-level=high
      - name: Install isolated audit tools
        run: npm install --prefix "$RUNNER_TEMP/portfolio-audit" --ignore-scripts playwright@1.58.2 lighthouse@13.0.3
      - name: Install test browser
        run: "$RUNNER_TEMP/portfolio-audit/node_modules/.bin/playwright install --with-deps chromium"
      - name: Browser and performance audit
        run: node scripts/browser-audit.mjs
        env:
          AUDIT_TOOLS: ${{ runner.temp }}/portfolio-audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: portfolio-audit
          path: audit-results/
          retention-days: 7

  resumes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install isolated PDF tools
        run: python3 -m pip install --target "$RUNNER_TEMP/resume-tools" reportlab==4.4.4 pypdf==6.1.1 pymupdf==1.26.4
      - name: Generate and check one-page resumes
        run: |
          python3 scripts/generate-resumes.py --check
          python3 - <<'PY'
          from pathlib import Path
          import pymupdf
          for lang, name in [("ES","Cv_Rodrigo_Suarez"),("EN","Cv_Rodrigo_Suarez_EN")]:
              path=Path("resume-results")/(name+".pdf")
              png=pymupdf.open(path)[0].get_pixmap(matrix=pymupdf.Matrix(1.3,1.3)).tobytes("png")
              (path.with_suffix(".png")).write_bytes(png)
          PY
        env:
          PYTHONPATH: ${{ runner.temp }}/resume-tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resumes
          path: resume-results/
          retention-days: 7
