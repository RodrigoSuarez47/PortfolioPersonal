name: Portfolio quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm audit --audit-level=high
      - name: Install isolated audit tools
        run: npm install --prefix "$RUNNER_TEMP/portfolio-audit" --ignore-scripts playwright@1.58.2 lighthouse@13.0.3
      - name: Install test browser
        run: "$RUNNER_TEMP/portfolio-audit/node_modules/.bin/playwright install --with-deps chromium"
      - name: Browser and performance audit
        run: node scripts/browser-audit.mjs
        env:
          AUDIT_TOOLS: ${{ runner.temp }}/portfolio-audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: portfolio-audit
          path: audit-results/
          retention-days: 7
