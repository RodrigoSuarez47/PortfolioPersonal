name: Portfolio quality
on:
  pull_request:
  push:
    branches: [main, feat/astro-static]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Export dependency lock for reproducibility
        run: node -e "console.log('LOCKFILE_GZIP=' + require('node:zlib').gzipSync(require('node:fs').readFileSync('package-lock.json')).toString('base64'))"
      - run: npm run validate
